<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{APP_NAME}} - RealCash Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function AdminPanel() {
            const [users, setUsers] = useState([
                { uid: "u_101", name: "PlayerOne", coins: 450, inr: 45, status: "Active" },
                { uid: "u_102", name: "TelegramVIP", coins: 1250, inr: 125, status: "Active" }
            ]);
            const [selectedTab, setSelectedTab] = useState('users');

            return (
                <div className="flex h-screen bg-gray-50">
                    <div className="w-64 bg-white border-r p-6 flex flex-col justify-between">
                        <div>
                            <h1 className="text-xl font-black text-indigo-700 mb-6">{{APP_NAME}} Admin</h1>
                            <nav className="space-y-2">
                                <button onClick={()=>setSelectedTab('users')} className={`w-full text-left p-3 rounded-xl font-bold text-sm ${selectedTab==='users'?'bg-indigo-50 text-indigo-600':'text-gray-500'}`}><i className="fas fa-users mr-2"></i> Users</button>
                                <button onClick={()=>setSelectedTab('tournaments')} className={`w-full text-left p-3 rounded-xl font-bold text-sm ${selectedTab==='tournaments'?'bg-indigo-50 text-indigo-600':'text-gray-500'}`}><i className="fas fa-gamepad mr-2"></i> Tournaments</button>
                                <button onClick={()=>setSelectedTab('payouts')} className={`w-full text-left p-3 rounded-xl font-bold text-sm ${selectedTab==='payouts'?'bg-indigo-50 text-indigo-600':'text-gray-500'}`}><i className="fas fa-money-bill-wave mr-2"></i> Payouts</button>
                            </nav>
                        </div>
                        <div className="text-xs text-gray-400 font-bold">{{ADMIN_EMAIL}}</div>
                    </div>

                    <div className="flex-1 p-8 overflow-y-auto">
                        <h2 className="text-2xl font-black mb-6 capitalize">{selectedTab} Management</h2>
                        
                        {selectedTab === 'users' && (
                            <div className="bg-white rounded-2xl shadow-sm border p-6">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b text-gray-400 font-bold uppercase text-xs">
                                            <th className="pb-3">User</th>
                                            <th className="pb-3">Coins</th>
                                            <th className="pb-3">INR</th>
                                            <th className="pb-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {users.map((u, i) => (
                                            <tr key={i} className="border-b">
                                                <td className="py-4 font-bold">{u.name} <span className="text-xs text-gray-400 block font-mono">{u.uid}</span></td>
                                                <td className="py-4 font-black text-amber-500">⭐ {u.coins}</td>
                                                <td className="py-4 font-black text-emerald-600">{{CURRENCY_SYMBOL}} {u.inr}</td>
                                                <td className="py-4"><span className="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-md">{u.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {selectedTab === 'tournaments' && (
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                    <h3 className="font-bold text-lg mb-2">1v1 Quick Ludo</h3>
                                    <p className="text-xs text-gray-400 mb-4">Entry: 50 ⭐ • Prize: {{CURRENCY_SYMBOL}} 10</p>
                                    <button className="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-xl">Active</button>
                                </div>
                                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                    <h3 className="font-bold text-lg mb-2">Tic Tac Toe Challenge</h3>
                                    <p className="text-xs text-gray-400 mb-4">Entry: 25 ⭐ • Prize: {{CURRENCY_SYMBOL}} 5</p>
                                    <button className="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-xl">Active</button>
                                </div>
                            </div>
                        )}

                        {selectedTab === 'payouts' && (
                            <div className="bg-white rounded-2xl p-8 text-center text-gray-400 font-bold border">
                                No pending withdrawal requests right now.
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AdminPanel />);
    </script>
</body>
</html>
