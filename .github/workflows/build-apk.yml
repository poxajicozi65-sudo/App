name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Found: $JAVA_VER"
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created or does not exist."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching in app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK file exists but is empty: $TARGET_APK"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) echo "Valid APK extension confirmed." ;;
            *) echo "ERROR: File does not have .apk extension: $TARGET_APK"; exit 1 ;;
          esac

          echo "APK successfully verified at $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "ERROR: Release asset does not exist: $ASSET_FILE"
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Release asset is empty: $ASSET_FILE"
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_FILE")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename is not exactly app-debug.apk. Found: $ASSET_FILENAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: \`${{ github.sha }}\`
          - **Keystore**: Signed with temporary debug keystore
          - **Notice**: Intended for testing only. Not a Play Store production release.
          EOF
          )

          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release APK Asset: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Direct Link**: \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Note: The Actions artifact named \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation step did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions backup artifact 'app-debug-apk' was uploaded."
            fi
            echo "## Build Succeeded - Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and is preserved as an Actions artifact (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
